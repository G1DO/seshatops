services:
  postgres:
    # PostgreSQL 16.14
    image: postgres@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    environment:
      POSTGRES_DB: seshatops_northstar_disposable
      POSTGRES_USER: seshatops
      POSTGRES_PASSWORD: seshatops-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [local]

  redpanda:
    # Redpanda v25.2.1
    image: docker.redpanda.com/redpandadata/redpanda@sha256:218469e5d088757bb2c3ff4c5e272f7eebdc4e94c933e6e15aff10b845cbcd07
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --overprovisioned
      - --smp
      - "1"
      - --reserve-memory
      - 0M
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls redpanda:9644 | grep -q Healthy"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [local]

  redpanda-init:
    # Redpanda v25.2.1
    image: docker.redpanda.com/redpandadata/redpanda@sha256:218469e5d088757bb2c3ff4c5e272f7eebdc4e94c933e6e15aff10b845cbcd07
    entrypoint: ["/bin/sh"]
    depends_on:
      redpanda:
        condition: service_healthy
    command:
      - -ec
      - >-
        rpk topic create seshatops.m1.events --brokers redpanda:9092
        --partitions 1 --replicas 1
        || rpk topic describe seshatops.m1.events --brokers redpanda:9092
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [local]

  oidc:
    # mock-oauth2-server 4.0.0
    image: ghcr.io/navikt/mock-oauth2-server@sha256:79f51f412caddb1e2120a5ae10d1f203e134f6e8328f1bc63c444acba33c9086
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/oidc/config.json:/app/config.json:ro
    environment:
      SERVER_PORT: "9090"
      JSON_CONFIG_PATH: /app/config.json
      LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/isalive"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks:
      local:
        aliases:
          - oidc.seshatops.localhost

  runtime:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    environment:
      SESHATOPS_LISTEN_ADDR: ":8080"
      SESHATOPS_DATABASE_URL: postgres://seshatops:seshatops-local-only@postgres:5432/seshatops_northstar_disposable?sslmode=disable
      SESHATOPS_BROKER_SEEDS: redpanda:9092
      SESHATOPS_OIDC_ISSUER: http://oidc.seshatops.localhost:9090/default
      SESHATOPS_OIDC_CLIENT_ID: seshatops-local
      SESHATOPS_OIDC_AUDIENCE: seshatops-local
      SESHATOPS_OIDC_REDIRECT_URL: http://web.seshatops.localhost:5173/auth/callback
      SESHATOPS_COOKIE_NAME: seshatops_session
      SESHATOPS_COOKIE_SECURE: "false"
      SESHATOPS_LOCAL_STACK: "true"
      SESHATOPS_AUTH_ASSIGNMENTS: northstar-demo-operator|11111111-1111-4111-8111-111111111111|ROLE-OPS-READER,northstar-demo-operator|11111111-1111-4111-8111-111111111111|ROLE-PLATFORM-OPERATOR,northstar-demo-operator|SCOPE-RUNTIME|ROLE-RELEASE-OBSERVER
      SESHATOPS_FORECAST_PYTHON: python3
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      oidc:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [local]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://runtime:8080
      VITE_CACHE_DIR: /tmp/seshatops-vite
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--configLoader", "runner"]
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5173/').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks:
      local:
        aliases:
          - web.seshatops.localhost

volumes:
  postgres-data:
  redpanda-data:

networks:
  local: {}
