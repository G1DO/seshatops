openapi: 3.0.3
info:
  title: SeshatOps HTTP API
  version: "1.0.0"
  description: |
    Go HTTP/SSE for the committed inventory projection, ops visibility,
    batch lineage, read-only M4 forecast feature snapshots and stockout
    predictions, privileged controls, and privileged-decision audit. A
    Go-owned session is required
    (`401 unauthenticated`). Allow-list rows are in
    docs/security/authorization.md (`403 forbidden` when unauthorized). SSE
    is at-least-once and may drop for slow clients; REST is the authoritative
    reconnect/catch-up path.
servers:
  - url: /
paths:
  /v1/tenants/{tenant_id}/inventory:
    get:
      operationId: getInventorySnapshot
      summary: Authoritative committed inventory projection snapshot
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Committed projection snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySnapshot"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for this tenant inventory read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          description: Invalid tenant_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: postInventoryRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/inventory/stream:
    get:
      operationId: streamInventoryUpdates
      summary: SSE stream of committed projection updates
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: >
            text/event-stream. Event name inventory_projection.updated;
            data is ProjectionUpdated JSON. SSE is at-least-once; REST is
            the reconnect/catch-up path.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ProjectionUpdated"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for this tenant inventory read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          description: Invalid tenant_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/forecast/features:
    get:
      operationId: getForecastFeatureSnapshot
      summary: Read-only deterministic M4 raw feature snapshot
      description: >
        Go-owned tenant-scoped replay of retained inventory history. The
        server fixes the dataset, feature definition, horizon, and source
        availability clock. Non-complete source states return 200 with an
        explicit status, reasons, and an empty rows array.
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Complete or explicit stale, incomplete, or insufficient snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastFeatureSnapshot"
        "400":
          description: Invalid tenant_id or unsupported snapshot-control query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for this tenant's forecast features
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "405":
          description: Method not allowed; Allow is GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: Read-only source load failed; no partial snapshot is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: postForecastFeaturesRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "405":
          description: Method not allowed; Allow is GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    put:
      operationId: putForecastFeaturesRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "405":
          description: Method not allowed; Allow is GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      operationId: patchForecastFeaturesRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "405":
          description: Method not allowed; Allow is GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      operationId: deleteForecastFeaturesRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "405":
          description: Method not allowed; Allow is GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/forecast/predictions/{resource_id}:
    get:
      operationId: getForecastPrediction
      summary: Authorized current stockout assessment with prediction lineage
      description: >
        Go selects the latest tenant-scoped prediction for the resource. The
        response includes explicit predicted, abstained, stale, and
        unavailable freshness state; it contains no raw feature values or
        model artifacts.
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Current or explicitly non-current stockout assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastPredictionSnapshot"
        "400":
          description: Invalid tenant_id or unsupported query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for this tenant's forecast predictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No prediction exists for the tenant-owned resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "405":
          description: Method not allowed; Allow is GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: Prediction or source freshness read failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: postForecastPredictionRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "405":
          description: Method not allowed; Allow is GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    put:
      operationId: putForecastPredictionRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "405":
          description: Method not allowed; Allow is GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      operationId: patchForecastPredictionRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "405":
          description: Method not allowed; Allow is GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      operationId: deleteForecastPredictionRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "405":
          description: Method not allowed; Allow is GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/ops:
    get:
      operationId: getOpsVisibility
      summary: Authorized lag, poison/quarantine, and projection freshness snapshot
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant-scoped ops visibility snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsSnapshot"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for this tenant ops read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          description: Invalid tenant_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: postOpsRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/ops/lineage/batches/{batch_id}:
    get:
      operationId: getBatchLineage
      summary: Authorized upstream and downstream lineage for one production batch
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/BatchID"
      responses:
        "200":
          description: Tenant-scoped lineage hops with source provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchTraceSnapshot"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for this tenant lineage read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          description: Invalid tenant_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: >
            Authorized caller, but the batch is missing in this tenant
            (including a batch id that only exists under another tenant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: postBatchLineageRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/BatchID"
      responses:
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/ops/quarantine/release:
    post:
      operationId: postQuarantineRelease
      summary: Authorized same-tenant outbox or poison quarantine retry (MX-004)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlRequest"
      responses:
        "200":
          description: Quarantine released to pending or re-driven through ProcessRecord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlResult"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for quarantine release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No same-tenant quarantined target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Terminal inbox quarantine is not releasable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: Control or audit persist failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/ops/replay:
    post:
      operationId: postReplay
      summary: Authorized same-tenant retained-history replay (MX-005)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlRequest"
      responses:
        "200":
          description: Replay result (duplicate_noop for already-applied events)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlResult"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No same-tenant replay target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: Control or audit persist failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/ops/rebuild:
    post:
      operationId: postRebuild
      summary: Authorized tenant-scoped derived-state rebuild (MX-006)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Rebuild result; incomplete is not a successful checksum proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlResult"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for rebuild
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: Control or audit persist failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/ops/audit:
    get:
      operationId: getOpsAudit
      summary: Authorized same-tenant privileged-decision timeline (MX-007)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Same-tenant audit records only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSnapshot"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for audit read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: Audit query failed (`audit_failed`); no records body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: Lowercase UUIDv4 tenant identifier (path assertion; matrix row evaluated separately)
    BatchID:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
        description: Production batch aggregate id (path assertion; tenant comes from tenant_id)
    ResourceID:
      name: resource_id
      in: path
      required: true
      schema:
        type: string
        description: Tenant-owned inventory resource identifier (path assertion; tenant comes from tenant_id)
  schemas:
    ForecastFeatureSnapshot:
      type: object
      required:
        - contract_version
        - status
        - tenant_id
        - dataset_version
        - feature_definition_version
        - source_history_boundary
        - snapshot_id
        - checksum
        - rows
        - status_reasons
      properties:
        contract_version:
          type: integer
          enum: [1]
        status:
          type: string
          enum: [complete, stale, incomplete, insufficient]
        tenant_id:
          type: string
          format: uuid
        dataset_version:
          type: string
          enum: [m4-stockout-eval-v1]
        feature_definition_version:
          type: string
          enum: [m4-raw-onhand-v1]
        source_history_boundary:
          $ref: "#/components/schemas/ForecastSourceHistoryBoundary"
        snapshot_id:
          type: string
          description: Deterministic SHA-256 snapshot identity
        checksum:
          type: string
          description: Deterministic SHA-256 canonical snapshot checksum
        rows:
          type: array
          description: Empty unless status is complete
          items:
            $ref: "#/components/schemas/ForecastFeatureRow"
        status_reasons:
          type: array
          items:
            type: string
    ForecastPredictionSnapshot:
      type: object
      required:
        - tenant_id
        - resource_type
        - resource_id
        - prediction_id
        - observation_date
        - forecast_horizon_days
        - target
        - status
        - stockout_risk
        - uncertainty
        - abstention_reason
        - freshness
        - lineage
        - correlation_id
        - recorded_at
        - observed_at
      properties:
        tenant_id:
          type: string
          format: uuid
        resource_type:
          type: string
          enum: [inventory_item]
        resource_id:
          type: string
        prediction_id:
          type: string
        observation_date:
          type: string
          format: date
        forecast_horizon_days:
          type: integer
          minimum: 1
        target:
          type: string
          enum: [stockout-within-horizon]
        status:
          type: string
          enum: [predicted, abstained]
        stockout_risk:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        uncertainty:
          allOf:
            - $ref: "#/components/schemas/ForecastPredictionUncertainty"
          nullable: true
        abstention_reason:
          type: string
        freshness:
          $ref: "#/components/schemas/ForecastPredictionFreshness"
        lineage:
          $ref: "#/components/schemas/ForecastPredictionLineage"
        correlation_id:
          type: string
        recorded_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
    ForecastPredictionUncertainty:
      type: object
      required: [method, lower, upper, sample_count]
      properties:
        method:
          type: string
        lower:
          type: number
          format: double
          minimum: 0
          maximum: 1
        upper:
          type: number
          format: double
          minimum: 0
          maximum: 1
        sample_count:
          type: integer
          minimum: 0
    ForecastPredictionFreshness:
      type: object
      required: [status, fresh_at]
      properties:
        status:
          type: string
          enum: [fresh, stale, unavailable]
        fresh_at:
          type: string
          format: date-time
    ForecastPredictionLineage:
      type: object
      required:
        - evaluation_protocol_version
        - dataset_version
        - feature_definition_version
        - feature_snapshot_id
        - feature_snapshot_checksum
        - source_cutoff_date
        - predictor
        - model_version
        - code_version
      properties:
        evaluation_protocol_version:
          type: string
        dataset_version:
          type: string
        feature_definition_version:
          type: string
        feature_snapshot_id:
          type: string
        feature_snapshot_checksum:
          type: string
        source_cutoff_date:
          type: string
          format: date
        predictor:
          type: string
          enum: [candidate, baseline]
        model_version:
          type: string
        code_version:
          type: string
    ForecastSourceHistoryBoundary:
      type: object
      required: [history_checksum, projection_checksum, applied_event_count]
      properties:
        history_checksum:
          type: string
        projection_checksum:
          type: string
        max_recorded_at:
          type: string
          format: date-time
        source_cutoff_date:
          type: string
          format: date
        applied_event_count:
          type: integer
          minimum: 0
    ForecastFeatureRow:
      type: object
      required:
        - row_id
        - tenant_id
        - item_id
        - as_of_date
        - source_cutoff_date
        - split
        - quantity_on_hand
        - history_hash
      properties:
        row_id:
          type: string
        tenant_id:
          type: string
          format: uuid
        item_id:
          type: string
        as_of_date:
          type: string
          format: date
        source_cutoff_date:
          type: string
          format: date
        split:
          type: string
          enum: [train, validation, test]
        quantity_on_hand:
          type: integer
          format: int64
          minimum: 0
        history_hash:
          type: string
    InventoryItem:
      type: object
      required: [item_id, quantity_on_hand, aggregate_version]
      properties:
        item_id:
          type: string
        quantity_on_hand:
          type: integer
          format: int64
          minimum: 0
        aggregate_version:
          type: integer
          format: int64
          minimum: 0
    InventorySnapshot:
      type: object
      required: [tenant_id, items, checksum, observed_at]
      properties:
        tenant_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        checksum:
          type: string
          description: docs/design/specifications/event-spine.md §8 SHA-256 hex of the tenant projection
        observed_at:
          type: string
          format: date-time
          description: Server UTC time when the snapshot was read
    ProjectionUpdated:
      type: object
      required:
        - tenant_id
        - item_id
        - quantity_on_hand
        - aggregate_version
        - last_applied_event_id
        - checksum
      properties:
        tenant_id:
          type: string
          format: uuid
        item_id:
          type: string
        quantity_on_hand:
          type: integer
          format: int64
        aggregate_version:
          type: integer
          format: int64
        last_applied_event_id:
          type: string
          format: uuid
        checksum:
          type: string
    OpsSnapshot:
      type: object
      required: [tenant_id, observed_at, projection, backlog, processing]
      properties:
        tenant_id:
          type: string
          format: uuid
        observed_at:
          type: string
          format: date-time
        projection:
          type: object
          required: [checksum, item_count]
          properties:
            checksum:
              type: string
            item_count:
              type: integer
        backlog:
          type: object
          required:
            - pending
            - publishing
            - published
            - quarantined
            - oldest_unpublished
            - quarantines
          properties:
            pending:
              type: integer
            publishing:
              type: integer
            published:
              type: integer
            quarantined:
              type: integer
            oldest_unpublished:
              type: string
              format: date-time
              nullable: true
            quarantines:
              type: array
              items:
                type: object
        processing:
          type: object
          required:
            - applied
            - duplicate_noop
            - quarantined_conflict
            - quarantined_gap
            - quarantined_stale
            - quarantined_invalid
            - quarantined_mismatch
            - quarantined_transition
            - failures_retrying
            - failures_quarantined
            - oldest_gap
            - oldest_failure
            - failures
            - gaps
          properties:
            applied:
              type: integer
            duplicate_noop:
              type: integer
            quarantined_conflict:
              type: integer
            quarantined_gap:
              type: integer
            quarantined_stale:
              type: integer
            quarantined_invalid:
              type: integer
