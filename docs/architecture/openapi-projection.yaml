openapi: 3.0.3
info:
  title: SeshatOps Event Spine Inventory Projection Read API
  version: "1.0.0"
  description: |
    Read-only Go surface for the committed Event Spine inventory projection (Issue #27).
    Authentication/RBAC remain Identity. Issue #45 requires a Go-owned session
    on these routes (`401 unauthenticated` when missing). Issue #46 requires
    MX-001 for inventory (`403 forbidden` when unauthorized). Issue #47
    requires MX-002 or MX-003 for ops visibility. Issue #48 requires MX-004,
    MX-005, or MX-006 for privileged POSTs. SSE is
    at-least-once and may drop for slow clients; REST is the authoritative
    reconnect/catch-up path.
servers:
  - url: /
paths:
  /v1/tenants/{tenant_id}/inventory:
    get:
      operationId: getInventorySnapshot
      summary: Authoritative committed inventory projection snapshot
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Committed projection snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySnapshot"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for this tenant inventory read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          description: Invalid tenant_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: postInventoryRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/inventory/stream:
    get:
      operationId: streamInventoryUpdates
      summary: SSE stream of committed projection updates
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: text/event-stream of inventory_projection.updated events
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for this tenant inventory read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          description: Invalid tenant_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/ops:
    get:
      operationId: getOpsVisibility
      summary: Authorized lag, poison/quarantine, and projection freshness snapshot
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant-scoped ops visibility snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsSnapshot"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for this tenant ops read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          description: Invalid tenant_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: postOpsRejected
      summary: Rejected write (read-only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/ops/quarantine/release:
    post:
      operationId: postQuarantineRelease
      summary: Authorized same-tenant outbox or poison quarantine retry (MX-004)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlRequest"
      responses:
        "200":
          description: Quarantine released to pending or re-driven through ProcessRecord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlResult"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for quarantine release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No same-tenant quarantined target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Terminal inbox quarantine is not releasable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/ops/replay:
    post:
      operationId: postReplay
      summary: Authorized same-tenant retained-history replay (MX-005)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlRequest"
      responses:
        "200":
          description: Replay result (duplicate_noop for already-applied events)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlResult"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/tenants/{tenant_id}/ops/rebuild:
    post:
      operationId: postRebuild
      summary: Authorized tenant-scoped derived-state rebuild (MX-006)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Rebuild result; incomplete is not a successful checksum proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlResult"
        "401":
          description: Missing, expired, forged, or revoked Go-owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not authorized for rebuild
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: Lowercase UUIDv4 tenant identifier (path assertion; matrix row evaluated separately)
  schemas:
    InventoryItem:
      type: object
      required: [item_id, quantity_on_hand, aggregate_version]
      properties:
        item_id:
          type: string
        quantity_on_hand:
          type: integer
          format: int64
          minimum: 0
        aggregate_version:
          type: integer
          format: int64
          minimum: 0
    InventorySnapshot:
      type: object
      required: [tenant_id, items, checksum, observed_at]
      properties:
        tenant_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        checksum:
          type: string
          description: CONTRACTS.md §8 SHA-256 hex of the tenant projection
        observed_at:
          type: string
          format: date-time
          description: Server UTC time when the snapshot was read
    ProjectionUpdated:
      type: object
      required:
        - tenant_id
        - item_id
        - quantity_on_hand
        - aggregate_version
        - last_applied_event_id
        - checksum
      properties:
        tenant_id:
          type: string
          format: uuid
        item_id:
          type: string
        quantity_on_hand:
          type: integer
          format: int64
        aggregate_version:
          type: integer
          format: int64
        last_applied_event_id:
          type: string
          format: uuid
        checksum:
          type: string
    OpsSnapshot:
      type: object
      required: [tenant_id, observed_at, projection, backlog, processing]
      properties:
        tenant_id:
          type: string
          format: uuid
        observed_at:
          type: string
          format: date-time
        projection:
          type: object
          required: [checksum, item_count]
          properties:
            checksum:
              type: string
            item_count:
              type: integer
        backlog:
          type: object
          required:
            - pending
            - publishing
            - published
            - quarantined
            - oldest_unpublished
            - quarantines
          properties:
            pending:
              type: integer
            publishing:
              type: integer
            published:
              type: integer
            quarantined:
              type: integer
            oldest_unpublished:
              type: string
              format: date-time
              nullable: true
            quarantines:
              type: array
              items:
                type: object
        processing:
          type: object
          required:
            - applied
            - quarantined_gap
            - failures_retrying
            - failures_quarantined
            - oldest_gap
            - oldest_failure
            - failures
            - gaps
          properties:
            applied:
              type: integer
            quarantined_gap:
              type: integer
            failures_retrying:
              type: integer
            failures_quarantined:
              type: integer
            oldest_gap:
              type: string
              format: date-time
              nullable: true
            oldest_failure:
              type: string
              format: date-time
              nullable: true
            failures:
              type: array
              items:
                type: object
            gaps:
              type: array
              items:
                type: object
    ControlRequest:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Target event identity; required for quarantine release
        tenant_id:
          type: string
          format: uuid
          description: Ignored client assertion; path tenant is authoritative
    ControlResult:
      type: object
      required: [tenant_id, control, status, applied, duplicate_noop, quarantined]
      properties:
        tenant_id:
          type: string
          format: uuid
        control:
          type: string
        event_id:
          type: string
          format: uuid
        status:
          type: string
        disposition:
          type: string
        applied:
          type: integer
        duplicate_noop:
          type: integer
        quarantined:
          type: integer
        checksum:
          type: string
        incomplete_reasons:
          type: array
          items:
            type: string
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
