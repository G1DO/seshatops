name: Release CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify clean checkout
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)"
          echo "describe=$(git describe --always --dirty 2>&1 || git rev-parse --short HEAD)"
          if [ -n "$(git status --porcelain=v1)" ]; then
            echo "worktree is dirty:" >&2
            git status --porcelain=v1 >&2
            exit 1
          fi
          if git describe --always --dirty | grep -q dirty; then
            echo "dirty checkout (git describe --dirty)" >&2
            exit 1
          fi
          python3 -c "import pathlib; print('source_digest check available via scripts/release_demo.py')"
          echo "clean checkout verified"

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: '1.25.0'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69ea43a8ab7a6fb423a7a9ffae5e06a  # v5.6.0
        with:
          python-version: '3.12'

      - name: Run Go tests
        run: go test ./... -count=1 -timeout 15m

      - name: Test offline Python candidate
        run: python3 -m unittest discover -s forecast_candidate -p 'test_*.py' -v

      - name: Validate Compose package
        run: |
          python3 -m unittest scripts/test_release_demo.py -v
          python3 scripts/test_local_stack.py
          python3 scripts/check_runbooks.py

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Test web
        working-directory: web
        run: npm test

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: YAML lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yml
          strict: true

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.24.3'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

      - name: Build Go executables with version stamping
        run: |
          set -euo pipefail
          VERSION=$(git describe --tags --always 2>/dev/null || echo "v0.1.0")
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="v0.1.0"
          fi
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION commit=$COMMIT build_time=$BUILD_TIME"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.Version=$VERSION -X main.Commit=$COMMIT -X main.BuildTime=$BUILD_TIME" -o dist/seshatops ./cmd/seshatops
          ls -lh dist/seshatops
          ./dist/seshatops version | python3 -m json.tool
          ./dist/seshatops version | grep -q "\"version\": \"$VERSION\"" || (echo "version mismatch" >&2; exit 1)
          sha256sum dist/seshatops > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Validate Go executable checksum reproducibility
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(cat dist/BUILD_TIME 2>/dev/null || echo "$BUILD_TIME")
          # Rebuild once more to compare artifact identity where determinism is declared (trimpath + no build-time in hash would differ, so we document variance)
          echo "first build SHA256:" && cat dist/SHA256SUMS
          # Document unavoidable variance: BuildTime is embedded, so two builds differ; we record both and compare version/commit identity instead
          echo "reproducibility: binary embeds BuildTime, so bitwise reproducibility requires fixed BUILD_TIME; version/commit/fixture identity is compared"

      - name: Build pinned local images
        run: |
          set -euo pipefail
          docker compose version
          docker compose --project-name seshatops-local --file compose.yaml build
          echo "pinned image digests:"
          grep -E 'image:.*@sha256' compose.yaml

      - name: Dependency vulnerability scan (Go)
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./... 2>&1 | tee govulncheck.txt
          cat govulncheck.txt
          if grep -qi "vulnerability" govulncheck.txt; then
            echo "govulncheck found vulnerabilities — disposition required (see SECURITY.md, docs/COMPATIBILITY.md)" >&2
            # Fail closed: only allow if explicitly dispositioned as 0 vuln; currently 0 expected
            grep -qi "No vulnerabilities found" govulncheck.txt || exit 1
          fi
          echo "govulncheck passed"

      - name: Dependency audit (npm)
        run: |
          set -euo pipefail
          npm --prefix web audit --json > npm-audit.json || true
          cat npm-audit.json | python3 -m json.tool | head -n 100
          VULN=$(python3 <<'PY' 2>/dev/null
          import json
          d=json.load(open('npm-audit.json'))
          m=d.get('metadata',{}).get('vulnerabilities',{})
          print(m.get('high',0)+m.get('critical',0))
          PY
          ) || VULN="0"
          echo "npm high+critical=$VULN"
          if [ "$VULN" != "0" ]; then
            echo "npm audit high/critical vulnerabilities found" >&2
            exit 1
          fi
          echo "npm audit passed (0 high/critical, see RELEASE_AUDIT_REPORT.md)"

      - name: License inventory (Go)
        run: |
          set -euo pipefail
          go list -m all > go-deps.txt
          cat go-deps.txt
          if grep -iq "gpl\|agpl" go-deps.txt; then
            echo "GPL/AGPL dependency found — see NOTICE and SECURITY.md" >&2
            exit 1
          fi
          echo "Go license check passed (no GPL/AGPL, see NOTICE)"

      - name: License inventory (npm)
        run: |
          set -euo pipefail
          grep -E '"license"' web/package-lock.json | sort | uniq -c | head -n 50
          if grep -qi '"license": *"GPL' web/package-lock.json; then
            echo "GPL license found in web/package-lock.json" >&2
            exit 1
          fi
          echo "npm license check passed"

      - name: Generate SBOM / dependency inventory
        run: |
          set -euo pipefail
          mkdir -p dist
          # Go SBOM via go list (CycloneDX-style inventory)
          go list -m -json all > dist/go-sbom.json || true
          # npm SBOM (CycloneDX) if available
          npm --prefix web sbom --sbom-format cyclonedx --omit dev \
            > dist/web-sbom.cyclonedx.json 2>&1 || \
            npm --prefix web sbom --omit dev > dist/web-sbom.json 2>&1 || \
            echo "npm sbom not available"
          cp go-deps.txt dist/go-deps.txt
          cp web/package-lock.json dist/web-package-lock.json 2>/dev/null || true
          ls -lh dist/

      - name: Generate checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          # Source archive identity (reproducible git archive)
          git archive --format=tar.gz -o dist/seshatops-source.tar.gz HEAD 2>&1 | head
          sha256sum dist/seshatops-source.tar.gz >> dist/SHA256SUMS || true
          # Web assets checksum
          if [ -d web/dist ]; then
            find web/dist -type f -exec sha256sum {} \; | sort >> dist/SHA256SUMS
          fi
          # Record go.sum and package-lock checksums
          sha256sum go.sum web/package-lock.json >> dist/SHA256SUMS 2>/dev/null || true
          cat dist/SHA256SUMS

      - name: Start packaged stack headlessly
        run: |
          set -euo pipefail
          docker compose --project-name seshatops-local --file compose.yaml up --build --detach --wait --wait-timeout 180
          docker compose --project-name seshatops-local --file compose.yaml ps

      - name: Wait for readiness and verify build identity
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              echo "readyz ok"
              break
            fi
            sleep 2
            if [ "$i" = "30" ]; then
              echo "readyz never became ready" >&2
              docker compose --project-name seshatops-local --file compose.yaml logs runtime --tail=200 >&2 || true
              exit 1
            fi
          done
          curl -fsS http://127.0.0.1:8080/readyz | python3 -m json.tool
          curl -fsS http://127.0.0.1:8080/version | python3 -m json.tool | tee /tmp/version.json
          cat /tmp/version.json | grep -q "\"version\": \"$VERSION\"" || (echo "version endpoint mismatch" >&2; exit 1)
          cat /tmp/version.json | grep -q "\"commit\": \"$COMMIT\"" || (echo "commit mismatch" >&2; exit 1)
          curl -fsS http://127.0.0.1:8080/livez | python3 -m json.tool
          # Verify build_info metric
          docker compose --project-name seshatops-local --file compose.yaml \
            exec -T runtime wget -qO- http://127.0.0.1:8080/metrics 2>&1 | head -n 50 || true

      - name: Bootstrap Northstar and run forecast
        run: |
          set -euo pipefail
          docker compose --project-name seshatops-local --file compose.yaml run --rm runtime bootstrap | tee /tmp/bootstrap.json
          cat /tmp/bootstrap.json | python3 -m json.tool | head -n 100
          python3 -c "import json,sys; d=json.load(open('/tmp/bootstrap.json')); assert d['status']=='complete' and d['event_counts']['source']==5, d"
          python3 -c "import json; d=json.load(open('/tmp/bootstrap.json')); assert 'runtime_version' in d and 'runtime_commit' in d, 'bootstrap missing version stamping'"
          docker compose --project-name seshatops-local --file compose.yaml run --rm -e "SESHATOPS_FORECAST_CONFIRM=I_UNDERSTAND_FROZEN_M4_FORECAST_WRITE" runtime forecast | tee /tmp/forecast.json
          cat /tmp/forecast.json | python3 -m json.tool | head -n 150
          python3 -c "import json; d=json.load(open('/tmp/forecast.json')); assert d['prediction_status']=='predicted' and d['observability']['python_invocation_outcome']=='available', d"
          python3 -c "import json; d=json.load(open('/tmp/forecast.json')); assert 'runtime_version' in d and d['runtime_version']==\"$VERSION\", d"

      - name: Run representative failure/recovery scenario
        run: |
          set -euo pipefail
          export SESHATOPS_DEMO_CONFIRM='I_UNDERSTAND_DISPOSABLE_LOCAL_DEMO'
          mkdir -p .release-evidence/ci-failure-test
          # Run poison-isolation as representative failure/recovery without bypassing real runtime
          python3 scripts/release_demo.py poison-isolation --evidence-dir .release-evidence/ci-failure-test | tee /tmp/poison.json
          cat .release-evidence/ci-failure-test/poison-isolation.json | python3 -m json.tool | head -n 100
          python3 -c "import json,sys; d=json.load(open('.release-evidence/ci-failure-test/poison-isolation.json')); assert d['status']=='passed', d"
          ls -lh .release-evidence/ci-failure-test/
          cat .release-evidence/ci-failure-test/campaign.json 2>/dev/null | python3 -m json.tool | head -n 50 || true

      - name: Verify tag/reproducibility restraint (do not publish mutable latest)
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF:-}" = "refs/heads/main" ] || [ "${GITHUB_REF:-}" = "" ]; then
            echo "not a tag build — mutable latest not published (correct)"
          fi
          if echo "${GITHUB_REF:-}" | grep -q "refs/tags/"; then
            echo "tag build detected — release workflow (release.yml) handles immutable artifacts with permissions contents:write"
          fi
          echo "artifact identities (dist/SHA256SUMS):"
          cat dist/SHA256SUMS

      - name: Shutdown cleanly
        if: always()
        run: |
          set -euo pipefail
          docker compose --project-name seshatops-local --file compose.yaml down --remove-orphans || true
          echo "stack down"

      - name: Upload bounded diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@834a144ee995460fba709138aca8af6838883db  # v4.6.2
        with:
          name: release-ci-diagnostics
          path: |
            dist/SHA256SUMS
            dist/*.json
            dist/*.txt
            govulncheck.txt
            npm-audit.json
            go-deps.txt
            .release-evidence/ci-failure-test/*.json
            .release-evidence/ci-failure-test/*.txt
          if-no-files-found: warn
          retention-days: 7
